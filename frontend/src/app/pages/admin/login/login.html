<div class="login-page">
  <div class="login-backdrop" aria-hidden="true">
    <img src="banners/clinic-reception.jpg" alt="" />
  </div>

  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="login-brand">
      <span class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <rect width="32" height="32" rx="9" fill="currentColor" />
          <path d="M16 8.5v15M10.5 16h11" stroke="#f4efe6" stroke-width="2" stroke-linecap="round" />
        </svg>
      </span>
      <div>
        <strong>Meridian Clinic</strong>
        <span>Admin desk</span>
      </div>
    </div>

    <h1>Admin login</h1>
    <p>Manage banners, doctors, services, and enquiries.</p>

    @if (error()) {
      <p class="admin-msg error">{{ error() }}</p>
    }

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    <button type="submit" class="login-submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
